[LightDM]

[Seat:*]

# Sesión por defecto
user-session=xfce

# Greeter
greeter-session=lightdm-gtk-greeter

# Permitir inicio de sesión de invitados
allow-guest=false

# Ocultar lista de usuarios
greeter-hide-users=false

# Mostrar inicio de sesión manual
greeter-show-manual-login=true

# Tiempo de espera
greeter-setup-script=

# Activar NumLock
greeter-allow-guest=false
